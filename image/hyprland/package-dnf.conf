[main]
reposdir=/inputs/repos
cachedir=/output/cache
system_cachedir=/output/cache
system_state_dir=/output/state
transaction_history_dir=/output/state
logdir=/output/log
destdir=/output/rpms
gpgcheck=1
localpkg_gpgcheck=1
sslverify=1
install_weak_deps=0
max_parallel_downloads=1
throttle=5M
keepcache=1
skip_if_unavailable=0
skip_broken=0
skip_unavailable=0
plugins=0
# This discovery container cannot write the installed RPM database and runs no
# RPM transaction; avoid requiring a writable system database lock.
skip_system_repo_lock=1
