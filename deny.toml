[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
# Add licences only alongside reviewed dependencies; no third-party crates yet.
allow = []

[licenses.private]
# First-party crates cannot be published until the product licence is chosen.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
