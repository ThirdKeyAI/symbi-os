name: Hosted Fedora graphics boot

on:
  pull_request:
    paths:
      - image/hyprland/graphics/**
      - image/base-images.json
      - image/hyprland/keys/fedora-45-primary.asc
      - image/toolchain/**
      - scripts/check-hosted-cloud-boot.sh
      - .github/workflows/graphics-cloud-boot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-cloud-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphics:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out proposed OS revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Boot signed Fedora guest with virtual GPU and no-GPU control
        run: bash scripts/check-hosted-cloud-boot.sh
      - name: Retain public graphics evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-cloud-boot-evidence
          path: .cache/hyprland-cloud-evidence/
          retention-days: 14
          if-no-files-found: error
