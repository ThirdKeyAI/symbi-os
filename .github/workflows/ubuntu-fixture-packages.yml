name: Ubuntu fixture package candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Authenticate current metadata or produce from reviewed pins
        required: true
        default: discover
        type: choice
        options:
          - discover
          - produce

# Both modes share this job. Pinned workflow actions can use its read-only job
# token; only the production step passes GITHUB_TOKEN to repository code.
permissions:
  actions: read
  contents: read

concurrency:
  group: ubuntu-fixture-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Authenticate and retain current Ubuntu metadata
        if: ${{ inputs.mode == 'discover' }}
        run: bash scripts/check-container-ubuntu-package-producer.sh discover

      - name: Consume reviewed metadata and prepare an unselected candidate
        if: ${{ inputs.mode == 'produce' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-container-ubuntu-package-producer.sh produce

      - name: Retain raw authenticated producer evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-ubuntu-fixture-package-evidence
          path: .cache/ubuntu-fixture-package-producer/evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Retain the validated unselected package candidate
        if: ${{ success() && inputs.mode == 'produce' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-ubuntu-fixture-packages
          path: .cache/ubuntu-fixture-package-producer/output/candidate/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Retain authenticated metadata for independent review
        if: ${{ success() && inputs.mode == 'discover' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-ubuntu-fixture-metadata
          path: .cache/ubuntu-fixture-package-producer/output/metadata/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
