name: Hyprland runtime compatibility

on:
  pull_request:
    paths:
      - image/hyprland/**
      - image/overlay/usr/share/symbiont/defaults/hypr/**
      - image/base-images.json
      - image/toolchain/**
      - scripts/check-hyprland-runtime.sh
      - .github/workflows/hyprland-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hyprland-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out proposed OS revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Fetch exact retained compiled prefix and signed runtime RPM bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          gh api repos/ThirdKeyAI/symbi-os/actions/artifacts/15070319189/zip > .cache/hyprland-development-prefix.zip
          echo 'b86fde7463a786a5bb5763edf3ee23cfac3829e7c5b596ad829e4d4861814743  .cache/hyprland-development-prefix.zip' | sha256sum --check --strict
          gh api repos/ThirdKeyAI/symbi-os/actions/artifacts/15072725272/zip > .cache/hyprland-runtime-rpms.zip
          echo 'ec4f092437c10b7ef63ab6c232240bb1c21898ece79d76bf10fbf47995a2cb85  .cache/hyprland-runtime-rpms.zip' | sha256sum --check --strict
      - name: Check additive offline runtime packaging and actual configuration parsing
        run: bash scripts/check-hyprland-runtime.sh
      - name: Retain public runtime evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hyprland-runtime-evidence
          path: .cache/hyprland-runtime-evidence/
          retention-days: 14
          if-no-files-found: error
