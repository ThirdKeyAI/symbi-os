name: Hosted Docker and gVisor fixtures

on:
  pull_request:
    paths:
      - image/container/hosted/**
      - scripts/check-container-fixtures.sh
      - .github/workflows/container-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: container-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out proposed OS revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Retrieve the exact checked development-binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          gh api repos/ThirdKeyAI/symbi-os/actions/artifacts/15066141540/zip > .cache/checked-runtime.zip
          echo 'bed79f624444c6dc0c3a5105facdcd9ad637a26f4fcd6cacb6e10544c36a0724  .cache/checked-runtime.zip' | sha256sum --check --strict
      - name: Authenticate inputs and run both complete fixture profiles
        run: bash scripts/check-container-fixtures.sh
      - name: Retain only public qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-fixture-evidence
          path: .cache/container-fixture-evidence/
          retention-days: 14
          if-no-files-found: error
