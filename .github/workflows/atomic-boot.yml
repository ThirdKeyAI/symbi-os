name: Atomic development disk boot

on:
  push:
    branches: ["**"]
    paths:
      - "image/atomic/**"
      - "image/boot/inputs.py"
      - "image/boot/preflight.py"
      - "image/boot/hosted.py"
      - "image/desktop-images.lock.json"
      - "image/base-images.json"
      - "image/release-trust.json"
      - "image/signing.py"
      - "image/keys/**"
      - "image/toolchain/reuse.py"
      - "image/launcher/probes/bounded_process.py"
      - "scripts/check-atomic-image.sh"
      - "scripts/check-atomic-boot.sh"
      - ".github/workflows/atomic-boot.yml"
      - "!image/atomic/README.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atomic-development-boot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      SYMBI_IMAGE_VARIANT: generic
    steps:
      - name: Check out the proposed boot harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Download the exact retained development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          artifact=$(python3 - <<'PY'
          import json
          from pathlib import Path
          from image.boot.inputs import require_desktop_image
          lock=json.loads(Path('image/desktop-images.lock.json').read_text())
          pins=json.loads(Path('image/base-images.json').read_text())
          require_desktop_image(lock,pins,'generic')
          print(lock['images']['generic']['artifact']['id'])
          PY
          )
          timeout 30 gh api "repos/ThirdKeyAI/symbi-os/actions/artifacts/$artifact" > .cache/atomic-image-artifact.json
          timeout 900 gh api "repos/ThirdKeyAI/symbi-os/actions/artifacts/$artifact/zip" > .cache/atomic-development-image.zip
      - name: Verify metadata and stream the exact retained image
        run: bash scripts/check-atomic-image.sh prepare
      - name: Install a new virtual disk and boot the actual Atomic image
        run: bash scripts/check-atomic-boot.sh
      - name: Retain bounded public installation and boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atomic-development-boot-generic
          path: |
            .cache/atomic-image-evidence
            .cache/atomic-disk-evidence
          if-no-files-found: error
          retention-days: 14
