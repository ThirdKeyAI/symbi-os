name: Desktop source intake

on:
  push:
    branches: [main]
    paths:
      - "image/tolaria/source.json"
      - "image/tolaria/inputs.py"
      - "image/tolaria/intake.py"
      - "image/tolaria/patches/**"
      - "image/default_apps/source-inputs.json"
      - "image/default_apps/inputs.py"
      - "image/default_apps/intake.py"
      - "image/tests/test_tolaria_inputs.py"
      - "image/tests/test_default_app_inputs.py"
      - "scripts/check-tolaria-intake.sh"
      - "scripts/check-default-app-intake.sh"
      - ".github/workflows/desktop-source-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-source-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the proposed OS revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Authenticate and inventory fixed Tolaria inputs without execution
        run: bash scripts/check-tolaria-intake.sh
      - name: Authenticate and inventory fixed terminal application inputs without execution
        run: bash scripts/check-default-app-intake.sh
      - name: Retain bounded public evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-source-intake-evidence
          path: |
            .cache/tolaria-intake-evidence/
            .cache/default-app-intake-evidence/
          retention-days: 14
          if-no-files-found: error
